name: Rails CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python adapter (${{ matrix.adapter }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        adapter: [bitcoin_core_backend, lightning_flask]
    defaults:
      run:
        working-directory: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.adapter }}/requirements.txt
            ${{ matrix.adapter }}/requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt
          else
            pip install -r requirements.txt pytest
          fi
      - name: Test
        run: python -m pytest tests/ -v

  security:
    permissions:
      contents: read
      pull-requests: read # Required by dependency review on pull requests.
      security-events: write # Required to upload SARIF security findings.
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
